<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Page title -->
<header><h1>Personal Expense Tracker</h1></header>

<main>
  <!-- Three boxes: income, expense, balance -->
  <section class="cards">
    <div class="card"><span>Total Income</span><b id="inc">0</b></div>
    <div class="card"><span>Total Expenses</span><b id="exp">0</b></div>
    <div class="card"><span>Balance</span><b id="bal">0</b></div>
  </section>

  <div class="grid">
    <!-- Form to add or edit a transaction -->
    <section class="panel">
      <h2 id="formTitle">Add Transaction</h2>
      <form id="txForm">
        <input type="hidden" id="txId">
        <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="Amount" required>
        <input type="date" id="date" required>
        <select id="category"></select>
        <input type="text" id="desc" placeholder="Description" required>
        <button class="btn">Save</button>
      </form>

      <!-- Add or delete categories -->
      <h3>Categories</h3>
      <form id="catForm" class="inline">
        <input id="catName" placeholder="New category" required>
        <button class="btn">Add</button>
      </form>
      <ul id="catList" class="chips"></ul>
    </section>

    <!-- Donut chart -->
    <section class="panel">
      <h2>Expense Chart</h2>
      <select id="chartMode"><option value="category">By Category</option><option value="month">By Month</option></select>
      <div class="donutWrap">
        <svg viewBox="0 0 42 42" id="donut"></svg>
        <div class="center"><small>Total Spent</small><b id="donutTotal">0</b></div>
      </div>
      <ul id="legend" class="legend"></ul>
    </section>
  </div>

  <!-- Monthly summary table -->
  <section class="panel">
    <h2>Monthly Summary</h2>
    <table><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr></thead><tbody id="monthBody"></tbody></table>
  </section>

  <!-- Search, filter and history table -->
  <section class="panel">
    <h2>Transaction History</h2>
    <div class="filters">
      <input id="fSearch" placeholder="Search description">
      <select id="fCategory"></select>
      <select id="fType"><option value="all">All Types</option><option value="income">Income</option><option value="expense">Expense</option></select>
      <input type="date" id="fFrom" title="From date">
      <input type="date" id="fTo" title="To date">
      <button class="btn" id="clearBtn">Clear</button>
    </div>
    <table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody id="txBody"></tbody></table>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
